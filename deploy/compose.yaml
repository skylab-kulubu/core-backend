services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-postgres}
      SUPER_SKYLAB_DB_PASSWORD: ${SUPER_SKYLAB_DB_PASSWORD:-postgres}
      SKYLAB_CMS_DB_PASSWORD: ${SKYLAB_CMS_DB_PASSWORD:-postgres}
      FORMS_DB_PASSWORD: ${FORMS_DB_PASSWORD:-postgres}
      SKYMAIL_DB_PASSWORD: ${SKYMAIL_DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  core:
    build:
      context: ..
      dockerfile: Dockerfile
    hostname: core
    profiles: ["core"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://super_skylab:${SUPER_SKYLAB_DB_PASSWORD:-postgres}@postgres:5432/super_skylab?sslmode=disable
      PORT: "8080"
      TRUSTED_PROXY_RANGES: ${TRUSTED_PROXY_RANGES:-}
      KEYCLOAK_URL: ${KEYCLOAK_URL:-}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-e-skylab}
      KEYCLOAK_ADMIN_URL: ${KEYCLOAK_ADMIN_URL:-}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL:-}
      SKYMAIL_URL: ${SKYMAIL_URL:-}
      # Unset takes the seeded key; an empty value falls back to the template id
      # below. The dash without a colon is what keeps that difference.
      SKYMAIL_WELCOME_TEMPLATE_KEY: ${SKYMAIL_WELCOME_TEMPLATE_KEY-core.welcome}
      SKYMAIL_CERTIFICATE_TEMPLATE_KEY: ${SKYMAIL_CERTIFICATE_TEMPLATE_KEY-core.certificate}
      SKYMAIL_WELCOME_TEMPLATE_ID: ${SKYMAIL_WELCOME_TEMPLATE_ID:-}
      SKYMAIL_CERTIFICATE_TEMPLATE_ID: ${SKYMAIL_CERTIFICATE_TEMPLATE_ID:-}
      # The user sync (docs/user-sync.md); unset takes the defaults.
      USER_SYNC_ENABLED: ${USER_SYNC_ENABLED:-}
      USER_SYNC_INTERVAL: ${USER_SYNC_INTERVAL:-}
      WELCOME_MAIL_SINCE: ${WELCOME_MAIL_SINCE:-}
      # Integration events (docs/integration-events.md): off unless set.
      EVENTS_ENABLED: ${EVENTS_ENABLED:-}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-}
      # Membership mail (docs/team-membership-mail.md): unset takes the
      # seeded key, an empty value turns that kind off.
      SKYMAIL_TEAM_MEMBERSHIP_TEMPLATE_KEY: ${SKYMAIL_TEAM_MEMBERSHIP_TEMPLATE_KEY-club.team-membership}
      SKYMAIL_ROLE_MEMBERSHIP_TEMPLATE_KEY: ${SKYMAIL_ROLE_MEMBERSHIP_TEMPLATE_KEY-club.role-membership}
      SKYMAIL_GROUP_MEMBERSHIP_TEMPLATE_KEY: ${SKYMAIL_GROUP_MEMBERSHIP_TEMPLATE_KEY-club.group-membership}
      # Privilege notice (docs/privilege-change-mail.md), the same way.
      SKYMAIL_PRIVILEGE_NOTICE_TEMPLATE_KEY: ${SKYMAIL_PRIVILEGE_NOTICE_TEMPLATE_KEY-club.privilege-change}
      # Event status mails (docs/event-cancel.md), the same way.
      SKYMAIL_EVENT_CANCELLED_TEMPLATE_KEY: ${SKYMAIL_EVENT_CANCELLED_TEMPLATE_KEY-core.event-cancelled}
      SKYMAIL_EVENT_REINSTATED_TEMPLATE_KEY: ${SKYMAIL_EVENT_REINSTATED_TEMPLATE_KEY-core.event-reinstated}
      # Feedback mails (docs/event-feedback.md), the same way.
      SKYMAIL_FEEDBACK_REQUEST_TEMPLATE_KEY: ${SKYMAIL_FEEDBACK_REQUEST_TEMPLATE_KEY-core.feedback-request}
      SKYMAIL_FEEDBACK_REMINDER_TEMPLATE_KEY: ${SKYMAIL_FEEDBACK_REMINDER_TEMPLATE_KEY-core.feedback-reminder}
      # The new Ticket's Notification (docs/ticket-created-notification.md).
      TICKET_CREATED_NOTIFICATION: ${TICKET_CREATED_NOTIFICATION:-off}
      GOTENBERG_URL: ${GOTENBERG_URL:-http://gotenberg:3000}
      PUBLIC_API_ORIGIN: ${PUBLIC_API_ORIGIN:-}
      PUBLIC_VERIFY_ORIGIN: ${PUBLIC_VERIFY_ORIGIN:-https://skyl.app/c}
      # Contact consents (docs/contact-consents.md): off while the key is unset.
      CONTACT_CONSENT_KEY: ${CONTACT_CONSENT_KEY:-}
      CONTACT_CONSENT_SERVICE_CLIENTS: ${CONTACT_CONSENT_SERVICE_CLIENTS:-}
      CONTACT_CONSENT_VERIFIED_CLIENTS: ${CONTACT_CONSENT_VERIFIED_CLIENTS:-}
      CONTACT_CONSENT_TEXT_URL: ${CONTACT_CONSENT_TEXT_URL:-}
      CONTACT_CONSENT_NOTICE_URL: ${CONTACT_CONSENT_NOTICE_URL:-}
      SKYMAIL_CONSENT_CONFIRM_TEMPLATE_KEY: ${SKYMAIL_CONSENT_CONFIRM_TEMPLATE_KEY:-}
      # Communication preferences (docs/communication-preferences.md): off while the key is unset.
      COMMUNICATION_PREFERENCE_KEY: ${COMMUNICATION_PREFERENCE_KEY:-}
      COMMUNICATION_PREFERENCE_ACCOUNT_CENTER_URL: ${COMMUNICATION_PREFERENCE_ACCOUNT_CENTER_URL:-}
      # Open and click tracking: opt_out unless set; the withdrawal's SkyMail address.
      COMMUNICATION_TRACKING_MODE: ${COMMUNICATION_TRACKING_MODE:-}
      COMMUNICATION_TRACKING_WITHDRAWAL_URL: ${COMMUNICATION_TRACKING_WITHDRAWAL_URL:-}
      # The News audience (docs/news-audience.md): only public records unless on.
      NEWS_AUDIENCE_PRIVATE_VISIBILITY: ${NEWS_AUDIENCE_PRIVATE_VISIBILITY:-}
      # The recipient question (docs/news-audience.md): the YTÜ identity provider, OBS unless set.
      KEYCLOAK_YTU_IDP_ALIAS: ${KEYCLOAK_YTU_IDP_ALIAS:-}
      # The SkyPass signing key: required, except that this local stack falls back to
      # a random key at start-up (SKYPASS_EPHEMERAL_KEY, development only).
      SKYPASS_EC_PRIVATE_KEY: ${SKYPASS_EC_PRIVATE_KEY:-}
      SKYPASS_EPHEMERAL_KEY: ${SKYPASS_EPHEMERAL_KEY:-true}
      # SkyPass in Google Wallet (docs/skypass-google-wallet.md): off unless true.
      SKYPASS_GOOGLE_WALLET_ENABLED: ${SKYPASS_GOOGLE_WALLET_ENABLED:-false}
      SKYPASS_GOOGLE_WALLET_ISSUER_ID: ${SKYPASS_GOOGLE_WALLET_ISSUER_ID:-}
      SKYPASS_GOOGLE_WALLET_CLASS_SUFFIX: ${SKYPASS_GOOGLE_WALLET_CLASS_SUFFIX:-}
      SKYPASS_GOOGLE_WALLET_SERVICE_ACCOUNT_JSON: ${SKYPASS_GOOGLE_WALLET_SERVICE_ACCOUNT_JSON:-}
      SKYPASS_GOOGLE_WALLET_TOTP_KEY: ${SKYPASS_GOOGLE_WALLET_TOTP_KEY:-}
      SKYPASS_GOOGLE_WALLET_ORIGINS: ${SKYPASS_GOOGLE_WALLET_ORIGINS:-}
      SKYPASS_GOOGLE_WALLET_LOGO_URL: ${SKYPASS_GOOGLE_WALLET_LOGO_URL:-}
      ACCOUNT_ACCESS_GATE_MODE: ${ACCOUNT_ACCESS_GATE_MODE:-off}
      ACCOUNT_ACCESS_REDIS_ADDR: ${ACCOUNT_ACCESS_REDIS_ADDR:-}
      ACCOUNT_ACCESS_REDIS_USERNAME: ${ACCOUNT_ACCESS_REDIS_USERNAME:-}
      ACCOUNT_ACCESS_REDIS_PASSWORD: ${ACCOUNT_ACCESS_REDIS_PASSWORD:-}
      ACCOUNT_ACCESS_REDIS_DB: ${ACCOUNT_ACCESS_REDIS_DB:-}
      ACCOUNT_ACCESS_REDIS_TLS: ${ACCOUNT_ACCESS_REDIS_TLS:-}
      ACCOUNT_ACCESS_REDIS_TLS_SERVER_NAME: ${ACCOUNT_ACCESS_REDIS_TLS_SERVER_NAME:-}
      ACCOUNT_ACCESS_REDIS_TLS_CERT_FILE: ${ACCOUNT_ACCESS_REDIS_TLS_CERT_FILE:-}
      ACCOUNT_ACCESS_REDIS_TLS_KEY_FILE: ${ACCOUNT_ACCESS_REDIS_TLS_KEY_FILE:-}
      ACCOUNT_ACCESS_REDIS_CA_CERT_FILE: ${ACCOUNT_ACCESS_REDIS_CA_CERT_FILE:-}
      ACCOUNT_ACCESS_REDIS_OPERATION_TIMEOUT: ${ACCOUNT_ACCESS_REDIS_OPERATION_TIMEOUT:-}
      ACCOUNT_ACCESS_REDIS_REQUIRED_REPLICAS: ${ACCOUNT_ACCESS_REDIS_REQUIRED_REPLICAS:-}
      ACCOUNT_ACCESS_REDIS_WAIT_TIMEOUT: ${ACCOUNT_ACCESS_REDIS_WAIT_TIMEOUT:-}
      ACCOUNT_ERASURE_WORKER_ENABLED: ${ACCOUNT_ERASURE_WORKER_ENABLED:-false}
      ACCOUNT_ERASURE_SKYMAIL_URL: ${ACCOUNT_ERASURE_SKYMAIL_URL:-}
      ACCOUNT_ERASURE_CMS_URL: ${ACCOUNT_ERASURE_CMS_URL:-}
      ACCOUNT_ERASURE_FORMS_URL: ${ACCOUNT_ERASURE_FORMS_URL:-}
      ACCOUNT_ERASURE_CLIENT_ID: ${ACCOUNT_ERASURE_CLIENT_ID:-}
      ACCOUNT_ERASURE_CLIENT_SECRET: ${ACCOUNT_ERASURE_CLIENT_SECRET:-}
      ACCOUNT_ERASURE_ALERT_AFTER: ${ACCOUNT_ERASURE_ALERT_AFTER:-480h}
      PERIODIC_DESTRUCTION_INTERVAL: ${PERIODIC_DESTRUCTION_INTERVAL:-2160h}
      CDN_BASE: ${CDN_BASE:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY:-}
      R2_SECRET_KEY: ${R2_SECRET_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The image's own check (docs/health-and-shutdown.md), more often.
      test: ["CMD", "/app/core-backend", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 12

  gotenberg:
    image: gotenberg/gotenberg:8.37.0
    profiles: ["certs"]
    restart: unless-stopped
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: skylab
