services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-postgres}
      SUPER_SKYLAB_DB_PASSWORD: ${SUPER_SKYLAB_DB_PASSWORD:-postgres}
      SKYLAB_CMS_DB_PASSWORD: ${SKYLAB_CMS_DB_PASSWORD:-postgres}
      FORMS_DB_PASSWORD: ${FORMS_DB_PASSWORD:-postgres}
      SKYNOTIFY_DB_PASSWORD: ${SKYNOTIFY_DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  core:
    build:
      context: ..
      dockerfile: Dockerfile
    hostname: core
    profiles: ["core"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://super_skylab:${SUPER_SKYLAB_DB_PASSWORD:-postgres}@postgres:5432/super_skylab?sslmode=disable
      PORT: "8080"
      TRUSTED_PROXY_RANGES: ${TRUSTED_PROXY_RANGES:-}
      KEYCLOAK_URL: ${KEYCLOAK_URL:-}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-e-skylab}
      KEYCLOAK_ADMIN_URL: ${KEYCLOAK_ADMIN_URL:-}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL:-}
      SKYNOTIFY_URL: ${SKYNOTIFY_URL:-}
      # Unset takes the seeded key; an empty value falls back to the template id
      # below. The dash without a colon is what keeps that difference.
      SKYNOTIFY_WELCOME_TEMPLATE_KEY: ${SKYNOTIFY_WELCOME_TEMPLATE_KEY-core.welcome}
      SKYNOTIFY_CERTIFICATE_TEMPLATE_KEY: ${SKYNOTIFY_CERTIFICATE_TEMPLATE_KEY-core.certificate}
      SKYNOTIFY_WELCOME_TEMPLATE_ID: ${SKYNOTIFY_WELCOME_TEMPLATE_ID:-}
      SKYNOTIFY_CERTIFICATE_TEMPLATE_ID: ${SKYNOTIFY_CERTIFICATE_TEMPLATE_ID:-}
      # The user sync (docs/user-sync.md); unset takes the defaults.
      USER_SYNC_ENABLED: ${USER_SYNC_ENABLED:-}
      USER_SYNC_INTERVAL: ${USER_SYNC_INTERVAL:-}
      WELCOME_MAIL_SINCE: ${WELCOME_MAIL_SINCE:-}
      # Integration events (docs/integration-events.md): off unless set.
      EVENTS_ENABLED: ${EVENTS_ENABLED:-}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-}
      EVENTS_FORMS_ENABLED: ${EVENTS_FORMS_ENABLED:-}
      FORMS_INTERNAL_URL: ${FORMS_INTERNAL_URL:-}
      # Membership mail (docs/team-membership-mail.md): unset takes the
      # seeded key, an empty value turns that kind off.
      SKYNOTIFY_TEAM_MEMBERSHIP_TEMPLATE_KEY: ${SKYNOTIFY_TEAM_MEMBERSHIP_TEMPLATE_KEY-club.team-membership}
      SKYNOTIFY_ROLE_MEMBERSHIP_TEMPLATE_KEY: ${SKYNOTIFY_ROLE_MEMBERSHIP_TEMPLATE_KEY-club.role-membership}
      SKYNOTIFY_GROUP_MEMBERSHIP_TEMPLATE_KEY: ${SKYNOTIFY_GROUP_MEMBERSHIP_TEMPLATE_KEY-club.group-membership}
      # Privilege notice (docs/privilege-change-mail.md), the same way.
      SKYNOTIFY_PRIVILEGE_NOTICE_TEMPLATE_KEY: ${SKYNOTIFY_PRIVILEGE_NOTICE_TEMPLATE_KEY-club.privilege-change}
      # Event status mails (docs/event-cancel.md), the same way.
      SKYNOTIFY_EVENT_CANCELLED_TEMPLATE_KEY: ${SKYNOTIFY_EVENT_CANCELLED_TEMPLATE_KEY-core.event-cancelled}
      SKYNOTIFY_EVENT_REINSTATED_TEMPLATE_KEY: ${SKYNOTIFY_EVENT_REINSTATED_TEMPLATE_KEY-core.event-reinstated}
      # Feedback mails (docs/event-feedback.md), the same way.
      SKYNOTIFY_FEEDBACK_REQUEST_TEMPLATE_KEY: ${SKYNOTIFY_FEEDBACK_REQUEST_TEMPLATE_KEY-core.feedback-request}
      SKYNOTIFY_FEEDBACK_REMINDER_TEMPLATE_KEY: ${SKYNOTIFY_FEEDBACK_REMINDER_TEMPLATE_KEY-core.feedback-reminder}
      # Management membership terms (docs/management-membership-terms.md).
      MANAGEMENT_TERMS_MODE: ${MANAGEMENT_TERMS_MODE:-off}
      MANAGEMENT_TERMS_WEEKLY_SUMMARY: ${MANAGEMENT_TERMS_WEEKLY_SUMMARY:-on}
      SKYNOTIFY_MANAGEMENT_TERM_TEMPLATE_KEY: ${SKYNOTIFY_MANAGEMENT_TERM_TEMPLATE_KEY-club.management-term}
      # A member's feedback mail as a Notification (docs/event-feedback.md).
      FEEDBACK_NOTIFICATION: ${FEEDBACK_NOTIFICATION:-off}
      # The new Ticket's Notification (docs/ticket-created-notification.md).
      TICKET_CREATED_NOTIFICATION: ${TICKET_CREATED_NOTIFICATION:-off}
      # The Ticket's PDF with that mail (docs/ticket-created-notification.md).
      TICKET_PDF_ATTACHMENT: ${TICKET_PDF_ATTACHMENT:-off}
      # The waiting list's mails (docs/event-capacity.md).
      TICKET_STATUS_MAIL: ${TICKET_STATUS_MAIL:-off}
      # A published Event's new time or place (docs/event-updated-notification.md).
      EVENT_UPDATED_NOTIFICATION: ${EVENT_UPDATED_NOTIFICATION:-off}
      # The reminder the day before an Event (docs/event-reminder.md).
      EVENT_REMINDER_NOTIFICATION: ${EVENT_REMINDER_NOTIFICATION:-off}
      SKYNOTIFY_EVENT_REMINDER_TEMPLATE_KEY: ${SKYNOTIFY_EVENT_REMINDER_TEMPLATE_KEY-event.reminder}
      EVENT_REMINDER_PER_MINUTE: ${EVENT_REMINDER_PER_MINUTE:-20}
      # The door's mails (docs/attendance-mail.md).
      ATTENDANCE_MAIL: ${ATTENDANCE_MAIL:-off}
      SKYNOTIFY_ATTENDANCE_WELCOME_TEMPLATE_KEY: ${SKYNOTIFY_ATTENDANCE_WELCOME_TEMPLATE_KEY-event.attendance-welcome}
      SKYNOTIFY_ATTENDANCE_RECORDED_TEMPLATE_KEY: ${SKYNOTIFY_ATTENDANCE_RECORDED_TEMPLATE_KEY-event.attendance-recorded}
      ATTENDANCE_MAIL_PER_MINUTE: ${ATTENDANCE_MAIL_PER_MINUTE:-20}
      GOTENBERG_URL: ${GOTENBERG_URL:-http://gotenberg:3000}
      PUBLIC_API_ORIGIN: ${PUBLIC_API_ORIGIN:-}
      PUBLIC_VERIFY_ORIGIN: ${PUBLIC_VERIFY_ORIGIN:-https://skyl.app/c}
      # Contact consents (docs/contact-consents.md): off while the key is unset.
      CONTACT_CONSENT_KEY: ${CONTACT_CONSENT_KEY:-}
      CONTACT_CONSENT_SERVICE_CLIENTS: ${CONTACT_CONSENT_SERVICE_CLIENTS:-}
      CONTACT_CONSENT_VERIFIED_CLIENTS: ${CONTACT_CONSENT_VERIFIED_CLIENTS:-}
      CONTACT_CONSENT_TEXT_URL: ${CONTACT_CONSENT_TEXT_URL:-}
      CONTACT_CONSENT_NOTICE_URL: ${CONTACT_CONSENT_NOTICE_URL:-}
      SKYNOTIFY_CONSENT_CONFIRM_TEMPLATE_KEY: ${SKYNOTIFY_CONSENT_CONFIRM_TEMPLATE_KEY:-}
      # Team pages (docs/team-page-consent.md): no longer read by the rosters
      # (every member is listed unless they object); nothing reads it (team-page-notice refuses).
      TEAM_PAGE_CONSENT_GRACE_UNTIL: ${TEAM_PAGE_CONSENT_GRACE_UNTIL:-}
      # Communication preferences (docs/communication-preferences.md): off while the key is unset.
      COMMUNICATION_PREFERENCE_KEY: ${COMMUNICATION_PREFERENCE_KEY:-}
      COMMUNICATION_PREFERENCE_KEY_V2: ${COMMUNICATION_PREFERENCE_KEY_V2:-}
      COMMUNICATION_PREFERENCE_KEY_CURRENT: ${COMMUNICATION_PREFERENCE_KEY_CURRENT:-}
      COMMUNICATION_PREFERENCE_ACCOUNT_CENTER_URL: ${COMMUNICATION_PREFERENCE_ACCOUNT_CENTER_URL:-}
      # App preferences (docs/app-preferences.md): off while unset; app:client pairs.
      APP_PREFERENCE_CLIENTS: ${APP_PREFERENCE_CLIENTS:-}
      # Open and click tracking: opt_out unless set; the withdrawal's SkyNotify address.
      COMMUNICATION_TRACKING_MODE: ${COMMUNICATION_TRACKING_MODE:-}
      COMMUNICATION_TRACKING_WITHDRAWAL_URL: ${COMMUNICATION_TRACKING_WITHDRAWAL_URL:-}
      # The News audience (docs/news-audience.md): only public records unless on.
      NEWS_AUDIENCE_PRIVATE_VISIBILITY: ${NEWS_AUDIENCE_PRIVATE_VISIBILITY:-}
      # The recipient question (docs/news-audience.md): the YTÜ identity provider, OBS unless set.
      KEYCLOAK_YTU_IDP_ALIAS: ${KEYCLOAK_YTU_IDP_ALIAS:-}
      # The SkyPass signing key: required, except that this local stack falls back to
      # a random key at start-up (SKYPASS_EPHEMERAL_KEY, development only).
      SKYPASS_EC_PRIVATE_KEY: ${SKYPASS_EC_PRIVATE_KEY:-}
      SKYPASS_EPHEMERAL_KEY: ${SKYPASS_EPHEMERAL_KEY:-true}
      # SkyPass in Google Wallet (docs/skypass-google-wallet.md): off unless true.
      SKYPASS_GOOGLE_WALLET_ENABLED: ${SKYPASS_GOOGLE_WALLET_ENABLED:-false}
      SKYPASS_GOOGLE_WALLET_ISSUER_ID: ${SKYPASS_GOOGLE_WALLET_ISSUER_ID:-}
      SKYPASS_GOOGLE_WALLET_CLASS_SUFFIX: ${SKYPASS_GOOGLE_WALLET_CLASS_SUFFIX:-}
      SKYPASS_GOOGLE_WALLET_SERVICE_ACCOUNT_JSON: ${SKYPASS_GOOGLE_WALLET_SERVICE_ACCOUNT_JSON:-}
      SKYPASS_GOOGLE_WALLET_TOTP_KEY: ${SKYPASS_GOOGLE_WALLET_TOTP_KEY:-}
      SKYPASS_GOOGLE_WALLET_ORIGINS: ${SKYPASS_GOOGLE_WALLET_ORIGINS:-}
      SKYPASS_GOOGLE_WALLET_LOGO_URL: ${SKYPASS_GOOGLE_WALLET_LOGO_URL:-}
      ACCOUNT_ACCESS_GATE_MODE: ${ACCOUNT_ACCESS_GATE_MODE:-off}
      ACCOUNT_ACCESS_REDIS_ADDR: ${ACCOUNT_ACCESS_REDIS_ADDR:-}
      ACCOUNT_ACCESS_REDIS_USERNAME: ${ACCOUNT_ACCESS_REDIS_USERNAME:-}
      ACCOUNT_ACCESS_REDIS_PASSWORD: ${ACCOUNT_ACCESS_REDIS_PASSWORD:-}
      ACCOUNT_ACCESS_REDIS_DB: ${ACCOUNT_ACCESS_REDIS_DB:-}
      ACCOUNT_ACCESS_REDIS_TLS: ${ACCOUNT_ACCESS_REDIS_TLS:-}
      ACCOUNT_ACCESS_REDIS_TLS_SERVER_NAME: ${ACCOUNT_ACCESS_REDIS_TLS_SERVER_NAME:-}
      ACCOUNT_ACCESS_REDIS_TLS_CERT_FILE: ${ACCOUNT_ACCESS_REDIS_TLS_CERT_FILE:-}
      ACCOUNT_ACCESS_REDIS_TLS_KEY_FILE: ${ACCOUNT_ACCESS_REDIS_TLS_KEY_FILE:-}
      ACCOUNT_ACCESS_REDIS_CA_CERT_FILE: ${ACCOUNT_ACCESS_REDIS_CA_CERT_FILE:-}
      ACCOUNT_ACCESS_REDIS_OPERATION_TIMEOUT: ${ACCOUNT_ACCESS_REDIS_OPERATION_TIMEOUT:-}
      ACCOUNT_ACCESS_REDIS_REQUIRED_REPLICAS: ${ACCOUNT_ACCESS_REDIS_REQUIRED_REPLICAS:-}
      ACCOUNT_ACCESS_REDIS_WAIT_TIMEOUT: ${ACCOUNT_ACCESS_REDIS_WAIT_TIMEOUT:-}
      ACCOUNT_ERASURE_WORKER_ENABLED: ${ACCOUNT_ERASURE_WORKER_ENABLED:-false}
      ACCOUNT_ERASURE_SKYNOTIFY_URL: ${ACCOUNT_ERASURE_SKYNOTIFY_URL:-}
      ACCOUNT_ERASURE_CMS_URL: ${ACCOUNT_ERASURE_CMS_URL:-}
      ACCOUNT_ERASURE_FORMS_URL: ${ACCOUNT_ERASURE_FORMS_URL:-}
      ACCOUNT_ERASURE_CLIENT_ID: ${ACCOUNT_ERASURE_CLIENT_ID:-}
      ACCOUNT_ERASURE_CLIENT_SECRET: ${ACCOUNT_ERASURE_CLIENT_SECRET:-}
      ACCOUNT_ERASURE_ALERT_AFTER: ${ACCOUNT_ERASURE_ALERT_AFTER:-480h}
      ACCOUNT_DELETION_NOTICES: ${ACCOUNT_DELETION_NOTICES:-off}
      SKYNOTIFY_ACCOUNT_DELETION_RECEIVED_TEMPLATE_KEY: ${SKYNOTIFY_ACCOUNT_DELETION_RECEIVED_TEMPLATE_KEY-account.deletion-requested}
      SKYNOTIFY_ACCOUNT_DELETION_COMPLETED_TEMPLATE_KEY: ${SKYNOTIFY_ACCOUNT_DELETION_COMPLETED_TEMPLATE_KEY-account.deletion-completed}
      PERIODIC_DESTRUCTION_INTERVAL: ${PERIODIC_DESTRUCTION_INTERVAL:-2160h}
      CDN_BASE: ${CDN_BASE:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY:-}
      R2_SECRET_KEY: ${R2_SECRET_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The image's own check (docs/health-and-shutdown.md), more often.
      test: ["CMD", "/app/core-backend", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 12

  gotenberg:
    image: gotenberg/gotenberg:8.37.0
    profiles: ["certs"]
    restart: unless-stopped
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: skylab
