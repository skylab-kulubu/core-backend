name: GHCR

# Two images, the same branches and tags: core (Dockerfile) and the video
# frame service (cmd/media-frame, Dockerfile.frame). main → :latest, :sandbox
# and the commit; production → :production and the commit; v*.*.* → the
# commit. Each main and production image is also tagged tree-<git tree>.
#
# production gets only a tree a fully green full Checks run has tested
# (scripts/ci/tested-tree.sh, docs/ci.md), and gets main's image of that tree
# when there is one, under its new tags (the same digest: what ran on sandbox
# runs on production). Only a tree main never had (a hotfix) is built again.
on:
  push:
    branches: [main, production]
    tags: ["v*.*.*"]

permissions:
  contents: read

# production's pushes one after the other: an older push (a hotfix still
# waiting for its tests) never ends after a newer one and puts its image back
# on :production. A newer push waiting in line replaces an older one that has
# not started.
concurrency:
  group: ghcr-${{ github.ref == 'refs/heads/production' && 'production' || github.run_id }}
  cancel-in-progress: false

jobs:
  # main's push run of Checks, or for a hotfix this push's own Checks run,
  # which this waits for.
  tested:
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7

      - name: Wait for a fully green full Checks run of this tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          deadline=$((SECONDS + 50 * 60))
          until bash scripts/ci/tested-tree.sh "$tree"; do
            # This push's own Checks run tests a tree main has not. Ended
            # without passing, nothing else will test it; rerun Checks, then
            # this workflow.
            ended=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/checks.yml/runs" \
              -f head_sha="$GITHUB_SHA" -f event=push \
              --jq '[.workflow_runs[] | select(.status == "completed" and .conclusion != "success")] | length')
            if (( ended > 0 )); then
              echo "The Checks run of $GITHUB_SHA did not pass." >&2
              exit 1
            fi
            if (( SECONDS > deadline )); then
              echo "No fully green full Checks run of tree $tree after 50 minutes." >&2
              exit 1
            fi
            sleep 60
          done

  image:
    name: image (${{ matrix.image }})
    needs: tested
    if: always() && (needs.tested.result == 'success' || needs.tested.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: core-backend
            dockerfile: Dockerfile
          # No Dokploy hook: its Dokploy application
          # (ops/wizards/media-frame-wizard.sh in sky_lab_genel) is deployed
          # by the wizard, which redeploys it when the tag's image differs
          # from the one running.
          - image: core-backend-media-frame
            dockerfile: Dockerfile.frame
    env:
      IMAGE: ghcr.io/skylab-kulubu/${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - id: tags
        env:
          REF: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=${IMAGE}:tree-${tree}" >> "$GITHUB_OUTPUT"
          if [ "$REF_TYPE" = branch ] && [ "$REF" = production ]; then
            echo "list=${IMAGE}:production,${IMAGE}:${GITHUB_SHA},${IMAGE}:tree-${tree}" >> "$GITHUB_OUTPUT"
          elif [ "$REF_TYPE" = branch ] && [ "$REF" = main ]; then
            echo "list=${IMAGE}:latest,${IMAGE}:sandbox,${IMAGE}:${GITHUB_SHA},${IMAGE}:tree-${tree}" >> "$GITHUB_OUTPUT"
          else
            echo "list=${IMAGE}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      # main's image of this tree, under production's tags.
      - name: Promote main's image of this tree
        id: promote
        if: github.ref == 'refs/heads/production'
        env:
          TREE_TAG: ${{ steps.tags.outputs.tree }}
          TAG_LIST: ${{ steps.tags.outputs.list }}
        run: |
          if ! docker buildx imagetools inspect "$TREE_TAG" > /dev/null 2>&1; then
            echo "No image of this tree yet ($TREE_TAG): building it."
            echo promoted=false >> "$GITHUB_OUTPUT"
            exit 0
          fi
          args=()
          IFS=, read -ra tags <<<"$TAG_LIST"
          for tag in "${tags[@]}"; do
            [ "$tag" = "$TREE_TAG" ] || args+=(--tag "$tag")
          done
          docker buildx imagetools create "${args[@]}" "$TREE_TAG"
          docker buildx imagetools inspect "${IMAGE}:production"
          echo promoted=true >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        if: steps.promote.outputs.promoted != 'true'
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.list }}
          # The builder stage's layers (the module download above all) from
          # the last build of a branch; kept in GHCR, not the Actions cache.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: ${{ github.ref_type == 'branch' && format('type=registry,ref={0}:buildcache,mode=max', env.IMAGE) || '' }}

      - name: Notify Dokploy
        if: matrix.image == 'core-backend' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production')
        env:
          REF_NAME: ${{ github.ref_name }}
          SANDBOX_HOOK: ${{ secrets.DOKPLOY_SANDBOX_DEPLOY_HOOK }}
          PRODUCTION_HOOK: ${{ secrets.DOKPLOY_DEPLOY_HOOK }}
        run: |
          if [ "$REF_NAME" = main ]; then
            HOOK="$SANDBOX_HOOK"
          else
            HOOK="$PRODUCTION_HOOK"
          fi
          if [ -z "$HOOK" ]; then
            echo "Dokploy hook unset for ${REF_NAME}; skip"
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
