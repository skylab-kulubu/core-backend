# TLS edge of the harness: the public names the services check (issuer, APP_URL, CORE_API_URL).
# No access log: request lines can carry identifiers.
global
  log stdout format raw local0 warning

defaults
  mode http
  log global
  timeout connect 5s
  timeout client 60s
  timeout server 60s

resolvers docker
  nameserver dns 127.0.0.11:53
  hold valid 5s

frontend https
  bind :443 ssl crt /usr/local/etc/haproxy/edge.pem
  option forwardfor
  http-request set-header X-Forwarded-Proto https
  http-request set-header X-Forwarded-Host %[req.hdr(host)]
  http-request set-header X-Forwarded-Port 443
  use_backend account_center if { req.hdr(host) -m beg -i my.yildizskylab.com }
  use_backend core if { req.hdr(host) -m beg -i api.yildizskylab.com }
  default_backend keycloak

backend keycloak
  server keycloak keycloak:8080 resolvers docker init-addr none

backend account_center
  server account_center account-center:3000 resolvers docker init-addr none

backend core
  server core core:8080 resolvers docker init-addr none
