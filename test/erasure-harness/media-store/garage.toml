# Garage for the erasure harness (compose.yaml, media-store): one node, metadata and data on the
# container's tmpfs. The RPC secret, the S3 key and the bucket come from the environment.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1
rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
# core's S3 client (internal/media/r2.go) signs for region "auto", as R2 expects.
s3_region = "auto"
api_bind_addr = "[::]:3900"
